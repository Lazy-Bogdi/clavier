name: Release

# Un tag "v4.3-fork.1" suffit a publier une version installable.
# Le depot est public (fork GPL-3.0): Obtainium lit les releases sans jeton.
# Sur main: build de controle seulement, ce qui alimente aussi le cache Gradle
# (les caches sont cloisonnes par reference git, un tag ne lit que ceux de main).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creer la release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Controle (hors tag)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: ./gradlew assembleRelease

      - name: Restaurer la cle de signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.CLAVIER_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/clavier-release.jks"

      - name: Construire la version signee
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLAVIER_KEYSTORE_PATH: ${{ runner.temp }}/clavier-release.jks
          CLAVIER_KEYSTORE_PASSWORD: ${{ secrets.CLAVIER_KEYSTORE_PASSWORD }}
          CLAVIER_KEY_ALIAS: clavier
          CLAVIER_KEY_PASSWORD: ${{ secrets.CLAVIER_KEYSTORE_PASSWORD }}
          # versionCode toujours croissant, exige par Android pour une mise a jour
          CLAVIER_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease

      - name: Verifier la signature
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # Empreinte SHA-256 du certificat du projet: seule cle qu'Android
          # acceptera pour mettre a jour l'appli installee.
          EMPREINTE: c1358455a7a027209fce17efb0856a6ad2119ba962f481cafff3b0f4079ba6da
        run: |
          set -o pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          echo "$CERTS" | grep -qi "SHA-256 digest: $EMPREINTE" \
            || { echo "::error::APK non signe avec la cle du projet."; exit 1; }
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          body: |
            Clavier perso (fork de HeliBoard, GPL-3.0). Mise a jour automatique via Obtainium.

      - name: Effacer la cle
        if: always()
        run: rm -f "$RUNNER_TEMP/clavier-release.jks"
